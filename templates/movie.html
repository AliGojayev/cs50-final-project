{% extends "layout.html" %}

{% block title %}
    Movie
{% endblock %}

{% block body %}
    {% if movie %}
        <table>
            <thead>
                <th>Title</th>
                <th>Genre</th>
                <th>Mood</th>
                <th>Year</th>
                <th>Rating</th>
            </thead>
            <tbody>
                <td>{{ movie.title }}</td>
                <td>{{ movie.genre }}</td>
                <td>{{ movie.mood }}</td>
                <td>{{ movie.release_year }}</td>
                <td>{% if movie.rating %}{{ movie.rating }}{% else %}N/A{% endif %}</td>
            </tbody>
        </table>
    {% endif %}
{% endblock %}
